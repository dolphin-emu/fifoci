[project]
name = "fifoci-frontend"
version = "0.1.0"
description = "The frontend for FifoCI, running at https://fifo.ci/ and hosting test cases and results."
authors = [{ name = "Pierre Bourdon", email = "delroth@dolphin-emu.org" }]
requires-python = ">=3.10,<3.11"
license = { text = "BSD-2-Clause" }

dependencies = [
  "Markdown>=3.10.3,<4",
  "Django>=5.1,<5.2",
  "psycopg2-binary>=2.9.12,<3",
  "gunicorn>=26.1.0,<27",
  "django-debug-toolbar>=6.3.0,<7",
]

[project.scripts]
fifoci-frontend-manage = "fifoci.frontend.manage:main"

[dependency-groups]
dev = [
    "black>=22.12.0,<23"
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "fifoci.frontend",
  "fifoci.frontend.settings",
  "fifoci.frontend.templatetags"
]

[tool.setuptools.package-dir]
"fifoci.frontend" = "."

[tool.setuptools.package-data]
"fifoci.frontend" = [
  "templates/**/*",
  "static/**/*",
  "migrations/**/*",
]
